name: Build and Dependency Submission

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Build backend and submit Gradle dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle and dependency submission
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: generate-and-submit
          cache-provider: basic

      - name: Build and test backend
        run: ./gradlew --no-daemon build

  frontend:
    name: Build Angular frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # GitHub reads npm dependencies directly from package.json and package-lock.json.
      - name: Install frontend dependencies
        run: npm ci

      - name: Download fonts
        run: |
          mkdir -p dist
          cd dist
          ../download-fonts.sh

      - name: Build frontend
        run: npm run build
